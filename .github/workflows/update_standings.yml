name: Nightly MLS Standings Update

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC (1:00 AM EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch TIP feed and compile standings
        run: python mls.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html u13_carolinas_data.json
          if git diff --staged --quiet; then
            echo "No schedule or standings changes detected. Skipping commit."
          else
            git commit -m "chore(standings): automated update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
