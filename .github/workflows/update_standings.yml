name: Nightly MLS Standings Update

on:
  schedule:
    # Runs at 05:00 UTC (1:00 AM EDT) every night
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual runs from the GitHub Actions UI

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch TIP feed and compile standings
        run: python mls.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html u13_carolinas_data.json
          if git diff --staged --quiet; then
            echo "No schedule or standings changes detected. Skipping commit."
          else
            git commit -m "chore(standings): automated update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi